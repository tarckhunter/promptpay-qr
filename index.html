<!DOCTYPE html>
<html lang="th">
<head>
    <title>PromptPay QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #6b7280, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 16px;
        }
        label {
            font-size: 1rem;
            color: #374151;
            display: block;
            margin-bottom: 8px;
        }
        .promptpay-id {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 16px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #generateBtn {
            background: linear-gradient(90deg, #3b82f6, #1e40af);
            color: white;
        }
        #confirmBtn {
            display: none;
            background: linear-gradient(90deg, #22c55e, #15803d);
            color: white;
        }
        .rate-box {
            margin-top: 24px;
            background: #f3f4f6;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .rate-box h2 {
            font-size: 1.2rem;
            color: #374151;
            margin-bottom: 8px;
        }
        .rate {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e3a8a;
            margin-bottom: 8px;
        }
        .update-time {
            font-size: 0.875rem;
            color: #6b7280;
        }
        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            h1 {
                font-size: 1.5rem;
            }
            input[type="number"], button {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>สร้าง QR Code พร้อมเพย์</h1>
        
        <label class="promptpay-id">เลขพร้อมเพย์: 0963293433</label>
        
        <label>จำนวนเงิน (USD):</label>
        <input type="number" id="usdAmount" step="0.01" placeholder="กรอกจำนวน USD">
        
        <label>จำนวนเงิน (THB):</label>
        <input type="number" id="thbAmount" step="0.01" placeholder="กรอกจำนวน THB">
        
        <button id="generateBtn" onclick="generateQR()">สร้าง QR Code</button>
        
        <button id="confirmBtn" onclick="confirmPayment()">ยืนยันการชำระเงิน</button>

        <div class="rate-box">
            <h2>1 ดอลลาร์สหรัฐ (USD) =</h2>
            <div class="rate" id="rate">กำลังโหลด...</div>
            <div class="update-time" id="updateTime"></div>
            <p>หน่วย: บาทไทย (THB)</p>
        </div>
    </div>

    <script>
        function generateQR() {
            const promptPayId = "0963293433";
            const amount = document.getElementById("thbAmount").value;

            if (amount === '' || parseFloat(amount) <= 0) {
                alert('กรุณากรอกจำนวนเงินที่มากกว่า 0');
                return;
            }

            const formattedAmount = parseFloat(amount).toFixed(2);
            const promptPayUrl = `https://promptpay.io/${promptPayId}/${formattedAmount}`;
            
            window.location.href = promptPayUrl;
        }

        function confirmPayment() {
            window.location.href = 'thank_you.php';
        }

        let currentRate = 0;

        async function fetchExchangeRate() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await response.json();
                currentRate = data.rates.THB;
                document.getElementById("rate").textContent = currentRate.toFixed(2) + " บาท";

                const now = new Date();
                const timeString = now.toLocaleTimeString('th-TH', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
                document.getElementById("updateTime").textContent = "อัปเดตล่าสุด: " + timeString;
            } catch (error) {
                document.getElementById("rate").textContent = "เกิดข้อผิดพลาด!";
                document.getElementById("updateTime").textContent = "";
            }
        }

        document.getElementById("usdAmount").addEventListener("input", function() {
            if (currentRate > 0) {
                const usd = parseFloat(this.value);
                if (!isNaN(usd)) {
                    document.getElementById("thbAmount").value = (usd * currentRate).toFixed(2);
                }
            }
        });

        document.getElementById("thbAmount").addEventListener("input", function() {
            if (currentRate > 0) {
                const thb = parseFloat(this.value);
                if (!isNaN(thb)) {
                    document.getElementById("usdAmount").value = (thb / currentRate).toFixed(2);
                }
            }
        });

        fetchExchangeRate();
        setInterval(fetchExchangeRate, 300000);
    </script>
</body>
</html>
