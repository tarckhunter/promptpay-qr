<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptPay Smart Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* โทนสีแบบแอปการเงินสมัยใหม่ */
            --primary: #1e3a8a;       /* Deep Navy */
            --primary-hover: #1e40af;
            --secondary: #3b82f6;     /* Bright Blue */
            --success: #10b981;       /* Emerald Green */
            --success-hover: #059669;
            --bg-gradient: radial-gradient(circle at 50% 0%, #e0e7ff 0%, #f8fafc 60%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(30, 58, 138, 0.15), 
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ตกแต่งด้านบน */
        .header {
            margin-bottom: 25px;
        }

        .promptpay-logo {
            font-weight: 800;
            color: #113566;
            letter-spacing: -0.5px;
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* จำลองขีดสีของ PromptPay */
        .promptpay-logo::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 24px;
            background: #ffb600; /* สีเหลืองพร้อมเพย์ */
            border-radius: 4px;
        }
        .promptpay-logo::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 24px;
            background: #113566; /* สีน้ำเงินพร้อมเพย์ */
            border-radius: 4px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .acc-info {
            color: var(--text-muted);
            font-size: 0.95rem;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
        }

        /* อัตราแลกเปลี่ยน */
        .rate-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #047857;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ช่องกรอกเงิน */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            margin-left: 6px;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 70px;
            font-size: 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            color: var(--text-dark);
            background: #ffffff;
        }

        .field-wrapper input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
        }

        .field-wrapper input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
        }

        .currency-tag {
            position: absolute;
            right: 20px;
            font-weight: 700;
            color: var(--secondary);
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* ปุ่มกด */
        button {
            width: 100%;
            padding: 18px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            font-family: 'Sarabun', sans-serif;
        }

        #generateBtn {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(30, 58, 138, 0.5);
        }

        #generateBtn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(30, 58, 138, 0.6);
        }

        /* ส่วนแสดง QR Code */
        #qr-display-area {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #e2e8f0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        #qrImage {
            width: 220px;
            height: 220px;
            margin: 0 auto 15px;
            display: block;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #f1f5f9;
        }

        .summary-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        #summaryText {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        #confirmBtn {
            background: var(--success);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.5);
        }

        #confirmBtn:hover {
            background: var(--success-hover);
            transform: translateY(-2px);
        }

        .footer-info {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; border-radius: 20px; }
            #qrImage { width: 180px; height: 180px; }
            .field-wrapper input { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="promptpay-logo">PromptPay</span>
        <h1>ชำระค่าบริการ</h1>
        <div class="acc-info">เลขที่บัญชี: 096-329-3433</div>
    </div>

    <div class="rate-badge">
        <span class="dot"></span>
        1 USD = <span id="rate" style="margin: 0 5px; font-weight: 700;">กำลังโหลด...</span> THB
    </div>

    <div class="input-group">
        <label>ระบุจำนวนเงิน (USD)</label>
        <div class="field-wrapper">
            <input type="number" id="usdAmount" placeholder="0.00" step="0.01">
            <span class="currency-tag">USD</span>
        </div>
    </div>

    <div class="input-group">
        <label>ยอดรวมที่ต้องชำระ (THB)</label>
        <div class="field-wrapper">
            <input type="number" id="thbAmount" placeholder="0.00" step="0.01">
            <span class="currency-tag">THB</span>
        </div>
    </div>

    <button id="generateBtn" onclick="generateQR()">สร้าง QR Code ทันที</button>

    <div id="qr-display-area">
        <div class="qr-card">
            <p style="font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; color: var(--text-dark);">
                Scan QR Code เพื่อชำระเงิน
            </p>
            <img id="qrImage" src="" alt="QR Code">
            <div class="summary-label">ยอดที่ต้องชำระ</div>
            <p id="summaryText"></p>
        </div>
        
        <button id="confirmBtn" onclick="confirmPayment()">แจ้งโอนเงินเรียบร้อยแล้ว</button>
    </div>

    <div class="footer-info">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="updateTime">อัปเดตราคาล่าสุด: --:--:--</span>
    </div>
</div>

<script>
    let currentRate = 0;

    // ระบบดึงข้อมูลอัตราแลกเปลี่ยน
    async function fetchExchangeRate() {
        try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await response.json();
            currentRate = data.rates.THB;
            document.getElementById("rate").textContent = currentRate.toFixed(2);

            const now = new Date();
            document.getElementById("updateTime").textContent = "อัปเดตราคาล่าสุด: " + now.toLocaleTimeString('th-TH');
        } catch (error) {
            document.getElementById("rate").textContent = "Error";
        }
    }

    // ฟังก์ชันสร้าง QR Code
    function generateQR() {
        const promptPayId = "0963293433"; // อ้างอิงตามโค้ดเดิมของคุณ
        const amount = document.getElementById("thbAmount").value;

        if (amount === '' || parseFloat(amount) <= 0) {
            alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
            return;
        }

        const formattedAmount = parseFloat(amount).toFixed(2);
        
        // เพิ่มลูกเล่นให้ปุ่มตอนกด
        const btn = document.getElementById("generateBtn");
        const originalText = btn.innerHTML;
        btn.innerHTML = "กำลังสร้าง...";
        btn.style.opacity = "0.8";

        // จำลองเวลาโหลดนิดหน่อยให้ดูสมจริง
        setTimeout(() => {
            const qrImageUrl = `https://promptpay.io/${promptPayId}/${formattedAmount}.png`;
            
            document.getElementById("qrImage").src = qrImageUrl;
            document.getElementById("summaryText").textContent = `฿${formattedAmount}`;
            document.getElementById("qr-display-area").style.display = "block";
            
            btn.innerHTML = originalText;
            btn.style.opacity = "1";

            // Scroll ลงไปให้เห็น QR อย่างนุ่มนวล
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }, 400);
    }

    function confirmPayment() {
        // เพิ่ม Effect ตอนกดปุ่มก่อนเปลี่ยนหน้า
        const btn = document.getElementById("confirmBtn");
        btn.innerHTML = "กำลังบันทึกข้อมูล...";
        setTimeout(() => {
            window.location.href = 'thank_you.php';
        }, 500);
    }

    // ระบบคำนวณเงินอัตโนมัติ
    document.getElementById("usdAmount").addEventListener("input", function() {
        if (currentRate > 0) {
            const usd = parseFloat(this.value);
            document.getElementById("thbAmount").value = !isNaN(usd) ? (usd * currentRate).toFixed(2) : "";
        }
    });

    document.getElementById("thbAmount").addEventListener("input", function() {
        if (currentRate > 0) {
            const thb = parseFloat(this.value);
            document.getElementById("usdAmount").value = !isNaN(thb) ? (thb / currentRate).toFixed(2) : "";
        }
    });

    // เริ่มทำงาน
    fetchExchangeRate();
    setInterval(fetchExchangeRate, 300000); // อัปเดตทุก 5 นาที
</script>

</body>
</html>
