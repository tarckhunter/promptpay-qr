<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptPay Smart Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #22c55e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #dbeafe 100%);
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(30, 58, 138, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ตกแต่งด้านบน */
        .header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .promptpay-logo {
            font-weight: 700;
            color: #00427a;
            letter-spacing: -1px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: block;
        }

        /* อัตราแลกเปลี่ยน */
        .rate-badge {
            display: inline-flex;
            align-items: center;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ช่องกรอกเงิน */
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
            display: block;
            margin-left: 4px;
        }

        .field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-wrapper input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 60px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .field-wrapper input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .currency-tag {
            position: absolute;
            right: 16px;
            font-weight: 700;
            color: #94a3b8;
        }

        /* ปุ่มกด */
        button {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        #generateBtn {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
        }

        #generateBtn:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        /* ส่วนแสดง QR Code */
        #qr-display-area {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed #e2e8f0;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        #qrImage {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            display: block;
            border-radius: 8px;
            background: white;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #confirmBtn {
            background: var(--success);
            color: white;
        }

        .footer-info {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container { padding: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="promptpay-logo">PromptPay</span>
        <h1>ชำระค่าบริการ</h1>
        <p style="color: #64748b; font-size: 0.9rem;">เลขที่บัญชี: 096-329-3433</p>
    </div>

    <div class="rate-badge">
        <span class="dot"></span>
        1 USD = <span id="rate" style="margin: 0 5px; font-weight: 700;">กำลังโหลด...</span> THB
    </div>

    <div class="input-group">
        <label>ระบุจำนวนเงิน (USD)</label>
        <div class="field-wrapper">
            <input type="number" id="usdAmount" placeholder="0.00" step="0.01">
            <span class="currency-tag">USD</span>
        </div>
    </div>

    <div class="input-group">
        <label>ยอดรวมที่ต้องชำระ (THB)</label>
        <div class="field-wrapper">
            <input type="number" id="thbAmount" placeholder="0.00" step="0.01">
            <span class="currency-tag">THB</span>
        </div>
    </div>

    <button id="generateBtn" onclick="generateQR()">สร้าง QR Code ทันที</button>

    <div id="qr-display-area">
        <div class="qr-card">
            <p style="font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #64748b;">Scan QR Code เพื่อชำระเงิน</p>
            <img id="qrImage" src="" alt="QR Code">
            <p id="summaryText" style="font-size: 1.1rem; font-weight: 700; color: var(--primary);"></p>
        </div>
        
        <button id="confirmBtn" onclick="confirmPayment()">แจ้งโอนเงินเรียบร้อยแล้ว</button>
    </div>

    <div class="footer-info">
        <span id="updateTime">อัปเดตราคาล่าสุด: --:--:--</span>
    </div>
</div>

<script>
    let currentRate = 0;

    // ระบบดึงข้อมูลอัตราแลกเปลี่ยน (คงเดิม)
    async function fetchExchangeRate() {
        try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
            const data = await response.json();
            currentRate = data.rates.THB;
            document.getElementById("rate").textContent = currentRate.toFixed(2);

            const now = new Date();
            document.getElementById("updateTime").textContent = "อัปเดตราคาล่าสุด: " + now.toLocaleTimeString('th-TH');
        } catch (error) {
            document.getElementById("rate").textContent = "Error";
        }
    }

    // ฟังก์ชันสร้าง QR (ปรับให้แสดงในหน้าเดียวกัน)
    function generateQR() {
        const promptPayId = "0802234671";
        const amount = document.getElementById("thbAmount").value;

        if (amount === '' || parseFloat(amount) <= 0) {
            alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
            return;
        }

        const formattedAmount = parseFloat(amount).toFixed(2);
        // ใช้ PromptPay.io API เพื่อดึงเป็นรูปภาพ
        const qrImageUrl = `https://promptpay.io/${promptPayId}/${formattedAmount}.png`;
        
        // แสดง UI
        document.getElementById("qrImage").src = qrImageUrl;
        document.getElementById("summaryText").textContent = `ยอดชำระ ฿${formattedAmount}`;
        document.getElementById("qr-display-area").style.display = "block";
        
        // Scroll ลงไปให้เห็น QR
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function confirmPayment() {
        window.location.href = 'thank_you.php';
    }

    // ระบบคำนวณเงินอัตโนมัติ (คงเดิม)
    document.getElementById("usdAmount").addEventListener("input", function() {
        if (currentRate > 0) {
            const usd = parseFloat(this.value);
            document.getElementById("thbAmount").value = !isNaN(usd) ? (usd * currentRate).toFixed(2) : "";
        }
    });

    document.getElementById("thbAmount").addEventListener("input", function() {
        if (currentRate > 0) {
            const thb = parseFloat(this.value);
            document.getElementById("usdAmount").value = !isNaN(thb) ? (thb / currentRate).toFixed(2) : "";
        }
    });

    // เริ่มทำงาน
    fetchExchangeRate();
    setInterval(fetchExchangeRate, 300000); // อัปเดตทุก 5 นาที
</script>

</body>
</html>
